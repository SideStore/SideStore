name: Export launch animation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animation-launch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    name: Render SwiftUI splash as MP4
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: "27.2"
      - name: Render preview video
        run: bash scripts/animation/export-launch.sh
      - name: Upload video and recording diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation_launch
          path: |
            build/animation_launch/animation_launch.mp4
            build/animation_launch/splash-logo.png
          if-no-files-found: warn
          retention-days: 14
