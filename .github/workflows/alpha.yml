name: Alpha SideStore Build

on:
  push:
    branches: [staging]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.gitmodules'
      - '.github/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      DEPLOY_KEY: ${{ secrets.CROSS_REPO_PUSH_KEY | }
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_NAME: Alpha
      CHANNEL: alpha
      UPSTREAM_CHANNEL: "nightly"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Force SideSign to the Windows-GSA Authentication.swift fix
      - name: Bump SideSign to Windows GSA fix
        run: |
          set -euo pipefail
          git config -f .gitmodules submodule.Dependencies/SideSign.url https://github.com/Mr3242-Scripter/SideSign.git
          git submodule sync Dependencies/SideSign
          cd Dependencies/SideSign
          git remote set-url origin https://github.com/Mr3242-Scripter/SideSign.git
          git fetch origin main
          git checkout caf60b7382fa242edce4b043af4ab1f8181bca16
          cd ../..
          echo "SideSign now at $(cd Dependencies/SideSign && git rev-parse HEAD)"
          grep -n "X-Xcode-Version|retryDelays|HTTP 429" Dependencies/SideSign/Sources/DeveloperPortal/Authentication.swift | head -5

      - name: Find Last Successful commit
        run: |
          LAST_SUCCESSFUL_COMMIT=$(python3 scripts/ci/workflow.py last-successful-commit \
            "false" "${{ env.CHANNEL }}" || echo "")
          echo "LAST_SUCCESSFUL_COMMIT=$LAST_SUCCESSFUL_COMMIT" | tee -a $GITHUB_ENV
